; Stamp Timer Power2 live web demo
;
; Two universal binaries:
;   - esp32   : ESP32 devices, runtime board detection by M5Unified
;   - esp32s3 : ESP32-S3 devices, runtime board detection by M5Unified
;
; Build:
;   pio run
;   pio run -e esp32
;
; Flash the generated firmware with your preferred M5Stack/ESP32 flashing tool.

[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include

[env]
platform = espressif32@6.13.0
framework = arduino
lib_extra_dirs = lib
lib_ldf_mode = deep+
lib_deps = ricmoo/QRCode@0.0.1
extra_scripts = pre:scripts/embed_web.py, scripts/merge_firmware.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.partitions = huge_app.csv
custom_firmware_version = 0.1.0
custom_firmware_owner = LHY
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Ilib/M5Unified/src
  -DCORE_DEBUG_LEVEL=0
  -DSTP2_FW_VERSION=\"${env.custom_firmware_version}\"
  -DSTP2_AP_PREFIX=\"M5STP2\"
  -DSTP2_AP_PASSWORD=\"m5stp2demo\"

[env:esp32]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DSTP2_BOARD_NAME=\"ESP32\"
  -DSTP2_DEFAULT_SDA=21
  -DSTP2_DEFAULT_SCL=22

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dout
board_build.boot = opi
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DSTP2_BOARD_NAME=\"ESP32S3\"
  -DSTP2_DEFAULT_SDA=8
  -DSTP2_DEFAULT_SCL=9
