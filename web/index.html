<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stamp Timer Power2</title>
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--ink:#1b2430;--muted:#66727f;--line:#e1e5ea;--soft:#f0f3f6;
  --accent:#0a7fd8;--on:#1fae4f;--warn:#b25b00;--warn-bg:#fff4e5;
  --p-gnd:#111;--p-pwr:#d23030;--p-i2c:#24496b;--p-int:#2f86e0;--p-wake:#a51f7c;--p-gpio:#f39a1e;
  --p-ctl:#ee4fd6;--p-adc:#077b77;--p-pwm:#f6b8d2;--p-neo:#2aa83a;
  --wire:#cfd6de;--flow:#e0362f;--flow-chg:#f39a1e;--stage:#f0f0f0;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318;--card:#171d24;--ink:#e6ebf1;--muted:#98a4b3;--line:#2a333d;--soft:#1f262f;
  --accent:#3aa0f0;--on:#3cc56a;--warn:#ffb35c;--warn-bg:#33240f;--wire:#36414d;--stage:#1b2129;--p-gnd:#000;
}}
:root[data-theme="dark"]{
  --bg:#0f1318;--card:#171d24;--ink:#e6ebf1;--muted:#98a4b3;--line:#2a333d;--soft:#1f262f;
  --accent:#3aa0f0;--on:#3cc56a;--warn:#ffb35c;--warn-bg:#33240f;--wire:#36414d;--stage:#1b2129;--p-gnd:#000;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--soft);padding:4px 11px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.src{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.src::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wire)}
.src[aria-pressed="true"]{border-color:var(--p-pwr);color:var(--p-pwr)}
.src[aria-pressed="true"]::before{background:var(--p-pwr)}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px 20px;max-width:1440px;margin:0 auto;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
#stage{padding:10px}
#panel{grid-row:1/span 2;grid-column:2;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1080px){main{grid-template-columns:minmax(0,1fr)}#panel{grid-column:1;grid-row:auto;position:static;max-height:none}}
@media (max-width:600px){main{padding:12px 16px}header{padding:10px 16px}header .sp{display:none}header h1{flex-basis:100%}}
#stageSvg{width:100%;height:auto;display:block;border-radius:8px;background:var(--stage);user-select:none}
.pill{cursor:pointer;outline:none}
.pill text{font:600 15px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pill:hover rect.base,.pill:focus-visible rect.base{stroke:var(--accent);stroke-width:3}
.pill.sel rect.base{stroke:var(--accent);stroke-width:4}
.alt{opacity:.3;transition:opacity .25s}
.alt.act{opacity:1}
.alt text{font:600 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.lead{stroke:var(--wire);stroke-width:2;stroke-dasharray:3 4}
.pill.sel .lead{stroke:var(--accent);stroke-dasharray:none;stroke-width:3}
.pad{fill:transparent;transition:fill .2s}
.pad.neo{animation:rgb 1.2s linear infinite}
@keyframes rgb{0%{fill:#ff3030}33%{fill:#30ff50}66%{fill:#3080ff}100%{fill:#ff3030}}
.pad.pwm{animation:blink .3s steps(2) infinite}
@keyframes blink{50%{fill-opacity:.15}}
.ring{fill:none;stroke:transparent;stroke-width:3}
.pill.sel .ring{stroke:var(--accent)}
#chipHit{cursor:pointer}
#legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 4px 2px;font-size:12px;color:var(--muted)}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend i{width:10px;height:10px;border-radius:50%}
#pinList{display:none;gap:6px;margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
#pinList button{border:0;border-radius:6px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}
#pinList button.sel{outline:3px solid var(--accent);outline-offset:1px}
@media (max-width:760px){#pinList{display:grid}}
.treeWrap{overflow-x:auto}
#treeSvg{min-width:720px;width:100%;height:auto;display:block}
.tn rect{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
.tn{cursor:pointer}
.tn.on rect{stroke:var(--p-pwr)}
.tn.chg rect{stroke:var(--flow-chg)}
.tn.hl rect{stroke:var(--accent);stroke-width:3.5}
.tn .t1{font:700 13px system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.tn .t2{font:600 12px var(--mono);fill:var(--muted);text-anchor:middle}
.tn.on .t2{fill:var(--ink)}
.ed{fill:none;stroke:var(--wire);stroke-width:3}
.ed.on{stroke:var(--flow);stroke-dasharray:9 7;animation:flow .7s linear infinite}
.ed.chg{stroke:var(--flow-chg);stroke-dasharray:9 7;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
/* panel */
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:20px;margin:0}
.tag{font-size:12px;border-radius:5px;padding:1px 8px;color:#fff;font-weight:600}
.pn{color:var(--muted);font-size:13px}
.back{margin-left:auto;border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;font-size:13px}
.lede{margin:8px 0 2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sec>h3{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:8px 0}
.row>.l{min-width:68px;color:var(--muted);font-size:13px}
.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .sw{width:36px;height:20px;border-radius:10px;background:var(--wire);position:relative;transition:background .2s;flex:none}
.tg .sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 2px #0004}
.tg input:checked+.sw{background:var(--on)}
.tg input:checked+.sw::after{left:18px}
.tg input:focus-visible+.sw{outline:2px solid var(--accent)}
input[type=range]{flex:1;min-width:110px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.big{font:700 22px var(--mono)}
.big small{font:13px system-ui,sans-serif;color:var(--muted);margin-left:6px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:5px 8px;margin:6px 0}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.state i{width:9px;height:9px;border-radius:50%;background:var(--wire)}
/* register bitfield */
.reg{margin:8px 0 12px}
.reg .rh{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:4px}
.reg .rh b{font-family:var(--mono)}
.reg .rh .a{font-family:var(--mono);color:var(--muted);font-size:12px}
.reg .rh .v{margin-left:auto;font-family:var(--mono);font-weight:700}
.bf{display:flex;flex-wrap:wrap;gap:4px}
.bf .c{border:1px solid var(--line);border-radius:6px;padding:3px 9px;text-align:center;transition:background .2s,border-color .2s}
.bf .c.multi{flex:1 1 70px}
.bf .c .n{display:block;font-size:11px;line-height:1.3;color:var(--muted);white-space:nowrap}
.bf .c .b{display:block;font:600 13px system-ui,sans-serif;line-height:1.3}
.bf .c.flag{padding:4px 9px}
.bf .c.flag .n{font:600 12px var(--mono)}
.bf .c.one{background:var(--accent);border-color:var(--accent)}
.bf .c.one .n{color:#fff}
pre.code{background:#0f1720;color:#d6e2ee;border-radius:8px;padding:10px;font:12px/1.5 var(--mono);overflow:auto;margin:0}
details.sec>summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;list-style:none}
details.sec>summary::before{content:"▸ "}
details.sec[open]>summary::before{content:"▾ "}
details.sec[open]>summary{margin-bottom:8px}
.strip{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.strip i{width:16px;height:16px;border-radius:50%;background:#333;border:1px solid var(--line)}
.btnPress{width:76px;height:76px;border-radius:50%;border:4px solid var(--line);background:var(--soft);font-weight:700;cursor:pointer;touch-action:none;flex:none}
.btnPress.down{background:var(--p-ctl);color:#fff;transform:scale(.95)}
.gest{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.gest .hit{color:var(--accent);font-weight:700}
.wave{display:block;width:100%;height:56px}
.wsrc{display:flex;flex-wrap:wrap;gap:4px}
.wsrc span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
.wsrc span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.timer{font:700 30px var(--mono)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:#222e;color:#fff;padding:8px 14px;border-radius:8px;font-size:13.5px;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.ed.on,.ed.chg,.pad.neo,.pad.pwm{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Stamp Timer Power2</h1>
  <span class="sp"></span>
  <div id="sources"></div>
  <div class="seg" id="langSeg"><button data-l="zh">中文</button><button data-l="en">EN</button></div>
</header>
<main>
  <section class="card" id="stage">
    <svg id="stageSvg" viewBox="0 0 1190 720" role="img" aria-label="Stamp Timer Power2 pin map"></svg>
    <div id="legend"></div>
    <div id="pinList"></div>
  </section>
  <aside class="card" id="panel"></aside>
  <section class="card" id="treeCard">
    <div class="treeWrap"><svg id="treeSvg" viewBox="0 0 1000 300"></svg></div>
  </section>
</main>
<div id="toast" hidden></div>
<script src="sim.js"></script>
<script src="info.js"></script>
<script src="ui.js"></script>
</body>
</html>
